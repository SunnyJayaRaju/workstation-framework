name: Shell Quality

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Shell Quality Checks
    runs-on: ${{ matrix.os }}
    strategy:
      # Run BOTH operating systems to completion even when one fails.
      #
      # With fail-fast left at its default (true), a failure on ubuntu-latest
      # cancels the macOS job before it runs, so a defect that only shows up on
      # one platform stays invisible: PR #22 sat red with every step after
      # "Run ShellCheck" unexecuted on macOS. Each matrix leg is cheap and
      # independent, so there is nothing to gain by stopping early.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: macos-latest
            shellcheck: shellcheck
            shfmt: shfmt
            bats: bats-core
          - os: ubuntu-latest
            shellcheck: shellcheck
            shfmt: shfmt
            bats: bats

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Exact versions, as observed in the logs of run 36914076094.
          # Unpinned installs let this runner drift from local machines,
          # which is what caused two red pushes on 2026-10-01 (shfmt 3.8.0
          # here vs 3.14.1 on macOS and on developer machines).
          sudo apt-get install -y \
            shellcheck=0.9.0-1 \
            shfmt=3.8.0-1 \
            bats=1.10.0-1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck shfmt bats-core

      - name: Verify macOS tool versions
        if: runner.os == 'macOS'
        run: |
          # Homebrew has no per-version pin for these formulae, so the
          # versions this runner is expected to use are asserted instead.
          # A mismatch fails the build rather than silently changing
          # formatting or lint behaviour. Values from run 36914076094.
          shellcheck_version="$(shellcheck --version | awk '/version:/ {print $2}')"
          shfmt_version="$(shfmt --version | sed 's/^v//')"
          bats_version="$(bats --version | awk '{print $NF}')"

          test "$shellcheck_version" = "0.11.0" || {
            echo "shellcheck $shellcheck_version, expected 0.11.0" >&2; exit 1; }
          test "$shfmt_version" = "3.14.1" || {
            echo "shfmt $shfmt_version, expected 3.14.1" >&2; exit 1; }
          test "$bats_version" = "1.14.0" || {
            echo "bats $bats_version, expected 1.14.0" >&2; exit 1; }

      - name: Verify Bash syntax
        run: |
          find scripts templates -type f -name "*.sh" -exec bash -n {} +

      - name: Run ShellCheck
        run: |
          find scripts templates -type f -name "*.sh" -exec shellcheck -x {} +

      - name: Verify shell formatting
        run: |
          find scripts templates -type f -name "*.sh" -exec shfmt -d -i 4 -ci {} +

      - name: Run Bats tests
        run: |
          bats tests

      - name: Run make check
        run: |
          make check

      - name: Run make doctor
        run: |
          make doctor
