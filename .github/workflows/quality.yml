name: Shell Quality

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Shell Quality Checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: macos-latest
            shellcheck: shellcheck
            shfmt: shfmt
            bats: bats-core
          - os: ubuntu-latest
            shellcheck: shellcheck
            shfmt: shfmt
            bats: bats

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck shfmt bats-core

      - name: Verify Bash syntax
        run: |
          find scripts templates -type f -name "*.sh" -exec bash -n {} +

      - name: Run ShellCheck
        run: |
          find scripts templates -type f -name "*.sh" -exec shellcheck -x {} +

      - name: Verify shell formatting
        run: |
          find scripts templates -type f -name "*.sh" -exec shfmt -d -i 4 -ci {} +

      - name: Run Bats tests
        run: |
          bats tests

      - name: Run make check
        run: |
          make check

      - name: Run make doctor
        run: |
          make doctor
