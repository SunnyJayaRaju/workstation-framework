name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install shellcheck shfmt bats-core

      - name: Verify quality
        run: make all

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract changelog for this version
          cat > /tmp/extract_changelog.awk << 'AWK_EOF'
          BEGIN {
              pat = "^## \\[" ver "\\]"
              pend = 0
              started = 0
          }
          # A different version's heading ends this one, before anything is printed.
          /^## \[/ && !($0 ~ pat) { if (started) exit }
          $0 ~ pat { started = 1 }
          started {
              # Hold back blank lines and "---" separators. They belong to whatever
              # follows, so if a version heading ends the section they are dropped
              # rather than trailing the body.
              if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*---+[[:space:]]*$/) {
                  buf[++pend] = $0
                  next
              }
              for (i = 1; i <= pend; i++) print buf[i]
              pend = 0
              print
          }
          AWK_EOF
          CHANGELOG=$(awk -v ver="${VERSION}" -f /tmp/extract_changelog.awk docs/CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false