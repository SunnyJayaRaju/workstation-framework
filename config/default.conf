# Default Developer Workstation Framework configuration

INSTALL_DIR="$HOME/.local/bin"
BACKUP_DIR="$HOME/.workstation/backups"

# List of files to back up (relative to HOME or absolute).
#
# Two formats are accepted:
#   - space-separated (one line) - existing format, for paths WITHOUT spaces
#   - one path per line (newline-separated) - required for any path that
#     contains a space, e.g. "my notes.txt"
#
# Backups are stored under BACKUP_DIR using the source path relative to
# $HOME with "/" replaced by "%", so ~/.ssh/config and a top-level ./config
# no longer collide. Backups written before that change (bare basename) are
# still found by restore.sh as a fallback.
BACKUP_SOURCES=".zshrc .gitconfig .ssh/config"

ENABLE_BACKUP=true
ENABLE_DOCTOR=true
ENABLE_CLEANUP=true
ENABLE_SHELLCHECK=true
ENABLE_SHFMT=true